  <line x1="37" y1="40" x2="60" y2="40" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="46" x2="60" y2="62" stroke="#888" stroke-width="2" stroke-linecap="round"/>

  <!-- provider boxes, the active one highlighted -->
  <rect x="62" y="10" width="30" height="16" rx="3" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="62" y="32" width="30" height="16" rx="3" fill="none" stroke="#cc2222" stroke-width="2"/>
  <rect x="62" y="54" width="30" height="16" rx="3" fill="none" stroke="#888" stroke-width="2"/>
