<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Partitioned log: three partitions on the topic -->
  <rect x="10" y="20" width="30" height="10" rx="2" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="10" y="35" width="30" height="10" rx="2" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="10" y="50" width="30" height="10" rx="2" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Records at the head of each partition -->
  <rect x="13" y="23" width="5" height="4" fill="#888"/>
  <rect x="13" y="38" width="5" height="4" fill="#888"/>
  <rect x="13" y="53" width="5" height="4" fill="#888"/>

  <!-- Consumption into a single Workflow execution -->
  <path d="M 44 25 L 58 38" fill="none" stroke="#cc2222" stroke-width="2" stroke-linecap="round"/>
  <path d="M 44 40 L 58 40" fill="none" stroke="#cc2222" stroke-width="2" stroke-linecap="round"/>
  <path d="M 44 55 L 58 42" fill="none" stroke="#cc2222" stroke-width="2" stroke-linecap="round"/>
  <polygon points="58,35 68,40 58,45" fill="#cc2222"/>

  <!-- Workflow execution started per record -->
  <rect x="72" y="28" width="18" height="24" rx="3" fill="none" stroke="#888" stroke-width="2"/>
  <line x1="77" y1="36" x2="85" y2="36" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="77" y1="41" x2="85" y2="41" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="77" y1="46" x2="85" y2="46" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
</svg>